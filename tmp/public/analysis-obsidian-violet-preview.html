<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ChessAZ — Анализ · обсидианово-фиолетовые кнопки</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0b11;color:#eee9f3;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{max-width:1460px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title{font-size:17px;font-weight:750;letter-spacing:.2px}
.title span{color:#c1a7d6}
.note{font-size:12px;color:#bcb4c7;line-height:1.5}
main{max-width:1460px;margin:0 auto;padding:0 16px 24px}
.frame{border:1px solid #5d4a6b;border-radius:14px;overflow:hidden;background:#0a0b0b;box-shadow:0 20px 70px rgba(15,6,28,.28)}
iframe{width:100%;height:min(82vh,840px);min-height:520px;display:block;border:0;background:#0a0b0b}
#error{display:none;padding:24px;background:#271927;color:#fbd9ef}
@media(max-width:650px){header{padding:14px 12px}.note{font-size:11px}main{padding:0 8px 12px}iframe{height:80vh;min-height:490px}}
</style>
</head>
<body>
<header><div class="title">ChessAZ <span>· новый Анализ</span></div><div class="note">Демонстрация: тёмный обсидиан с лёгким лиловым переливом<br>Доска, фигуры, расположение блоков и логика не изменены</div></header>
<main><div class="frame"><iframe id="demo" title="Макет панели анализа ChessAZ с обсидиановыми кнопками" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><div id="error" role="alert"></div></div></main>
<script>
(async function(){
  try{
    const response=await fetch('./analysis-redesign-preview.html',{cache:'no-store'});
    if(!response.ok)throw new Error('Исходный макет недоступен (HTTP '+response.status+')');
    const outer=new DOMParser().parseFromString(await response.text(),'text/html');
    const source=outer.getElementById('mock-source');
    if(!source)throw new Error('Не найден исходный интерактивный макет');
    let html=JSON.parse(source.textContent);
    const start=html.indexOf('chessaz-premium-emerald-buttons');
    const end=html.indexOf('\\u003c/style>',start);
    if(start<0||end<0)throw new Error('Не найден изолированный блок оформления кнопок');
    const palette={"#153429":"#2C2B39","#F5F0E5":"#E9E5ED","#597553":"#766D83","#11251E":"#262532","#CCD5CA":"#D7D2DE","#294D3B":"#403B4E","#205640":"#373342","#FFF8E9":"#F1EDF5","#C3A563":"#877B96","#143127":"#292837","#EBD6A4":"#DAD2E2","#496B51":"#696173","#12291F":"#252633","#D1D9CE":"#D7D2DE","#375747":"#403B4D","#20533D":"#383443","#FFF8EC":"#F3EFF7","#B79856":"#8D809C","#C1D2C3":"#D7D2DE","#27684D":"#3F3A4C","#FFF7E5":"#F3EFF7","#C2A667":"#8B8099","#1F6248":"#3B3748","#FFF7E8":"#F5F0F8","#C9A868":"#9588A5"};
    let buttonStyle=html.slice(start,end);
    if(!buttonStyle.includes('#153429'))throw new Error('Палитра исходного макета изменилась');
    for(const [from,to] of Object.entries(palette))buttonStyle=buttonStyle.split(from).join(to);
    html=html.slice(0,start)+buttonStyle+html.slice(end);
    document.getElementById('demo').srcdoc=html;
  }catch(err){
    const e=document.getElementById('error');e.style.display='block';
    e.textContent='Ошибка загрузки демонстрации: '+(err&&err.message||'неизвестная ошибка');
  }
})();
</script>
</body>
</html>
