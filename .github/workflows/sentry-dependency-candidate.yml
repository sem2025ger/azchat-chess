name: Sentry dependency candidate (isolated QA)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  candidate:
    if: github.event.pull_request.head.ref == 'fix/sentry-dependencies-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate pinned Sentry candidate without running install scripts
        working-directory: server
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact @sentry/node@11.19.0
          git diff --stat -- package.json package-lock.json
          npm ci --ignore-scripts
      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=moderate
      - name: Upload candidate manifests for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentry-dependency-candidate
          path: |
            server/package.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 7
