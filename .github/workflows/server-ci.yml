name: Server CI

on:
  push:
    branches:
      - main
      - fix/server-dependency-security-20261016
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking security fixes
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Install exactly from refreshed lockfile
        run: npm ci --ignore-scripts

      - name: Run server tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: server-package-lock
          path: server/package-lock.json
          if-no-files-found: error

      - name: Commit audited lockfile on security branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/server-dependency-security-20261016'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(server): refresh audited lockfile"
          git push
